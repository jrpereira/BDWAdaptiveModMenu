name: Build and test
on:
  push:
    branches: ['**', '!release/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  repository-hygiene:
    uses: ./.github/workflows/repository-hygiene.yml
  lua-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Compile Lua and run mock tests
        run: |
          find Scripts tests -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
          for test in tests/*_test.lua; do lua5.4 "$test"; done
      - name: Test release packaging
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build archive and checksum
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: mod-package
          path: dist/*
          if-no-files-found: error
